<!doctype html>
<html>
  <head>
    <title>XTTS Voice Cloning</title>
  </head>
  <body>
    <h1>XTTS Voice Cloning Demo</h1>
    <form method="post" enctype="multipart/form-data">
      <label>Text to synthesize:</label><br>
      <textarea name="text" rows="4" cols="50">This is a cloned voice example.</textarea><br><br>
      <label>Upload voice sample (.wav):</label><br>
      <input type="file" name="audio" accept=".wav" required><br><br>
      <input type="submit" value="Generate voice">
    </form>
  </body>
</html>
